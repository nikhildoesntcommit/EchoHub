<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lost signal · EchoHub</title>
  <meta name="robots" content="noindex" />
  <script>
    // GitHub Pages serves this for unknown paths. Send the listener back to the dial,
    // turning paths like /EchoHub/ep/why-we-dream into the app's hash route.
    // Works for project pages (/EchoHub/...), user pages and custom domains alike:
    // everything before the first known app route is treated as the site base.
    (function () {
      var routes = ['ep', 'band', 'search', 'studio', 'library', 'about'];
      var segs = location.pathname.split('/').filter(Boolean);
      var i = -1;
      for (var k = 0; k < segs.length; k++) { if (routes.indexOf(segs[k]) !== -1) { i = k; break; } }
      var baseSegs;
      if (i !== -1) baseSegs = segs.slice(0, i);
      else baseSegs = /\.github\.io$/.test(location.hostname) && segs.length ? segs.slice(0, 1) : [];
      var base = '/' + baseSegs.join('/') + (baseSegs.length ? '/' : '');
      var rest = i !== -1 ? segs.slice(i).join('/') : '';
      location.replace(base + '#/' + rest + location.search);
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d0c10; color: #f4efe7; font: 16px system-ui, sans-serif; }
    a { color: #ff6b3d; }
  </style>
</head>
<body>
  <p>Lost signal. <a href="./">Back to the dial</a></p>
</body>
</html>
