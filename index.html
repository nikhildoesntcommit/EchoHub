<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EchoHub — Tune into ideas</title>
  <meta name="description" content="EchoHub is a radio for curious minds: drag the dial to tune into short audio explainers on technology, science, geography and history. Works offline." />
  <meta name="theme-color" content="#0d0c10" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f2ede4" media="(prefers-color-scheme: light)" />
  <meta name="color-scheme" content="dark light" />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="EchoHub" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="EchoHub — Tune into ideas" />
  <meta property="og:description" content="A radio for curious minds. Short audio explainers you tune into with a dial. Free, offline-ready, no account." />
  <meta property="og:image" content="https://nikhildoesntcommit.github.io/EchoHub/assets/img/og-image.png" />
  <meta property="og:url" content="https://nikhildoesntcommit.github.io/EchoHub/" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="assets/css/app.css" />

  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var s = JSON.parse(localStorage.getItem('echohub:v2') || '{}').settings || {};
      if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <div class="shell">
    <aside class="rail" aria-label="Primary">
      <a class="brand" href="#/" aria-label="EchoHub home">
        <svg class="brand__mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="var(--signal)"/><circle cx="24" cy="32" r="6.5" fill="var(--signal-ink)"/><path d="M31.46 21.35A13 13 0 0 1 31.46 42.65M36.62 13.98A22 22 0 0 1 36.62 50.02" fill="none" stroke="var(--signal-ink)" stroke-width="4.6" stroke-linecap="round"/></svg>
        <span class="brand__word">EchoHub</span>
      </a>
      <nav class="rail__nav" data-nav>
        <a href="#/" data-route="listen"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 12 16 8"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg><span>Listen</span></a>
        <a href="#/search" data-route="search"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><span>Search</span></a>
        <a href="#/studio" data-route="studio"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg><span>Studio</span></a>
        <a href="#/library" data-route="library"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 4v16M10 4v16"/><path d="m14.5 4.6 4.8 15"/></svg><span>Library</span></a>
        <a href="#/about" data-route="about"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5"/><circle cx="12" cy="8" r=".6" fill="currentColor"/></svg><span>About</span></a>
      </nav>
      <div class="rail__foot">
        <button type="button" class="rail__btn" data-action="install" hidden>Install app</button>
        <a class="rail__btn rail__btn--mobile" href="#/about">About</a>
        <button type="button" class="rail__btn" data-action="settings">Settings</button>
        <button type="button" class="rail__btn" data-action="shortcuts">Shortcuts <kbd>?</kbd></button>
        <p class="rail__status mono" id="netStatus"><i></i><span>On air</span></p>
      </div>
    </aside>

    <main id="main" class="view" tabindex="-1"></main>
  </div>

  <!-- The deck: persistent mini player -->
  <section class="deck" id="deck" aria-label="Player" hidden>
    <div class="deck__progress" aria-hidden="true"><span id="deckBar"></span></div>
    <button type="button" class="deck__open" data-action="open-np" aria-label="Open now playing">
      <span class="deck__cover" id="deckCover"></span>
      <span class="deck__text">
        <span class="deck__title" id="deckTitle">Nothing tuned</span>
        <span class="deck__meta mono" id="deckMeta"></span>
      </span>
    </button>
    <div class="deck__ctrls">
      <button type="button" class="ibtn deck__wide" data-action="skip-back" aria-label="Skip back"></button>
      <button type="button" class="pbtn" id="deckPlay" data-action="toggle" aria-label="Play"></button>
      <button type="button" class="ibtn" data-action="skip-fwd" aria-label="Skip forward"></button>
      <button type="button" class="ibtn deck__wide mono deck__rate" data-action="rate" aria-label="Playback speed">1×</button>
      <button type="button" class="ibtn deck__wide" data-action="queue" aria-label="Up next"></button>
    </div>
  </section>

  <nav class="tabbar" aria-label="Primary" data-nav>
    <a href="#/" data-route="listen"><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 12 16 8"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg><span>Listen</span></a>
    <a href="#/search" data-route="search"><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><span>Search</span></a>
    <a href="#/studio" data-route="studio"><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg><span>Studio</span></a>
    <a href="#/library" data-route="library"><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 4v16M10 4v16"/><path d="m14.5 4.6 4.8 15"/></svg><span>Library</span></a>
  </nav>

  <!-- Now playing -->
  <section class="np" id="np" role="dialog" aria-modal="true" aria-label="Now playing" hidden>
    <div class="np__bg" id="npBg"></div>
    <header class="np__top">
      <button type="button" class="ibtn" data-action="close-np" aria-label="Close now playing"></button>
      <p class="np__kicker mono" id="npKicker">Now tuned</p>
      <button type="button" class="ibtn" data-action="np-details" aria-label="Episode details"></button>
    </header>
    <div class="np__stage">
      <canvas class="np__viz" id="npViz" aria-hidden="true"></canvas>
      <div class="np__ring" id="npRing" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle class="np__ring-track" cx="100" cy="100" r="96"/>
          <circle class="np__ring-fill" id="npRingFill" cx="100" cy="100" r="96" pathLength="1000"/>
        </svg>
        <span class="np__knob" id="npKnob"></span>
      </div>
      <div class="np__cover" id="npCover"></div>
    </div>
    <div class="np__info">
      <div class="np__titles">
        <h2 class="np__title" id="npTitle">—</h2>
        <p class="np__meta mono" id="npMeta"></p>
      </div>
      <button type="button" class="ibtn keep" id="npKeep" data-keep="" aria-pressed="false" aria-label="Keep"></button>
    </div>
    <div class="np__times mono"><span id="npCur">0:00</span><span id="npLeft">-0:00</span></div>
    <div class="np__ctrls">
      <button type="button" class="ibtn mono np__rate" data-action="rate" aria-label="Playback speed">1×</button>
      <button type="button" class="ibtn ibtn--lg" data-action="prev" aria-label="Previous"></button>
      <button type="button" class="ibtn ibtn--lg skipbtn" data-action="skip-back" aria-label="Skip back"></button>
      <button type="button" class="pbtn pbtn--xl" id="npPlay" data-action="toggle" aria-label="Play"></button>
      <button type="button" class="ibtn ibtn--lg skipbtn" data-action="skip-fwd" aria-label="Skip forward"></button>
      <button type="button" class="ibtn ibtn--lg" data-action="next" aria-label="Next"></button>
      <button type="button" class="ibtn np__timer" data-action="sleep" aria-label="Sleep timer"></button>
    </div>
    <button type="button" class="np__next" data-action="queue" id="npNext"></button>
  </section>

  <dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
    <div class="sheet__inner">
      <header class="sheet__head">
        <h2 id="sheetTitle">—</h2>
        <button type="button" class="ibtn" data-action="close-sheet" aria-label="Close"></button>
      </header>
      <div class="sheet__body" id="sheetBody"></div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <audio id="audio" preload="metadata"></audio>

  <noscript>
    <div class="noscript">EchoHub needs JavaScript to tune the dial. Please enable it and reload.</div>
  </noscript>

  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
